<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-label="DSH Bot architecture diagram">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d10"/>
      <stop offset="1" stop-color="#11161c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#49e0a8"/>
      <stop offset="1" stop-color="#7aa2ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#49e0a8"/>
    </marker>
    <marker id="arrowDim" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7683"/>
    </marker>
  </defs>

  <rect width="1200" height="560" fill="url(#bg)"/>
  <g stroke="#ffffff" stroke-opacity="0.035">
    <path d="M0 80H1200M0 160H1200M0 240H1200M0 320H1200M0 400H1200M0 480H1200"/>
    <path d="M120 0V560M240 0V560M360 0V560M480 0V560M600 0V560M720 0V560M840 0V560M960 0V560M1080 0V560"/>
  </g>

  <text x="64" y="72" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="30" font-weight="700">DSH Bot</text>
  <text x="64" y="104" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">local-first bot team · Boss delegates, specialists execute</text>

  <!-- You -->
  <g>
    <rect x="70" y="238" width="150" height="84" rx="14" fill="#151b22" stroke="#2a3440"/>
    <text x="145" y="272" text-anchor="middle" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600">You</text>
    <text x="145" y="298" text-anchor="middle" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">one chat</text>
  </g>

  <!-- Boss -->
  <g>
    <rect x="300" y="210" width="190" height="140" rx="18" fill="#121a17" stroke="#49e0a8" stroke-opacity="0.55"/>
    <circle cx="395" cy="252" r="16" fill="#1b2b24" stroke="#49e0a8"/>
    <text x="395" y="258" text-anchor="middle" fill="#49e0a8" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">♛</text>
    <text x="395" y="292" text-anchor="middle" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="17" font-weight="600">Boss / 老大</text>
    <text x="395" y="316" text-anchor="middle" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">judge · split · delegate · review</text>
  </g>

  <!-- Specialists -->
  <g>
    <rect x="620" y="118" width="230" height="74" rx="12" fill="#151b22" stroke="#2a3440"/>
    <text x="648" y="149" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">🧹 磁盘清理</text>
    <text x="648" y="172" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">space · cache · old backups</text>

    <rect x="620" y="212" width="230" height="74" rx="12" fill="#151b22" stroke="#2a3440"/>
    <text x="648" y="243" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">🎓 大学事务</text>
    <text x="648" y="266" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">courses · assignments · dates</text>

    <rect x="620" y="306" width="230" height="74" rx="12" fill="#151b22" stroke="#2a3440"/>
    <text x="648" y="337" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">📦 软件盘点</text>
    <text x="648" y="360" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">installed apps · licenses</text>

    <rect x="620" y="400" width="230" height="74" rx="12" fill="#151b22" stroke="#2a3440" stroke-dasharray="5 5"/>
    <text x="648" y="431" fill="#b9c2cc" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">＋ new specialist</text>
    <text x="648" y="454" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">bot_hire when nobody fits</text>
  </g>

  <!-- Arrows -->
  <g fill="none" stroke="#49e0a8" stroke-width="2" marker-end="url(#arrow)">
    <path d="M220 280 C260 280 260 280 296 280"/>
    <path d="M490 250 C550 250 560 155 616 155"/>
    <path d="M490 280 C550 280 560 249 616 249"/>
    <path d="M490 310 C550 310 560 343 616 343"/>
    <path d="M490 340 C550 340 560 437 616 437" stroke="#6b7683" stroke-dasharray="5 5" marker-end="url(#arrowDim)"/>
  </g>
  <g fill="#6f7c89" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10">
    <text x="246" y="266">ask</text>
    <text x="520" y="140">delegate</text>
    <text x="520" y="274">delegate</text>
    <text x="520" y="376">delegate</text>
    <text x="520" y="470">hire</text>
  </g>
  <g fill="none" stroke="#7aa2ff" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrowDim)">
    <path d="M850 155 C930 155 960 250 1010 280"/>
    <path d="M850 249 C930 249 970 272 1010 280"/>
    <path d="M850 343 C930 343 970 300 1010 286"/>
  </g>

  <!-- Receipts -->
  <g>
    <rect x="1012" y="232" width="130" height="92" rx="14" fill="#151b22" stroke="#2a3440"/>
    <text x="1077" y="266" text-anchor="middle" fill="#e8edf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">Receipts</text>
    <text x="1077" y="290" text-anchor="middle" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">steps · tokens</text>
    <text x="1077" y="308" text-anchor="middle" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">evidence</text>
  </g>

  <!-- Bottom bar -->
  <g>
    <rect x="70" y="502" width="1072" height="34" rx="8" fill="#11161c" stroke="#202933"/>
    <text x="92" y="524" fill="#7d8794" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="11">DSH Session · real tools · files · Git memory · group chat · stand-up · local only</text>
  </g>
</svg>
