name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and client activation guard
        run: node scripts/check-client.cjs
      - name: UX layout guards
        run: node scripts/check-ux.cjs
      - name: Token budget guards
        run: node scripts/check-budget.cjs
      - name: No-scroll batch guards
        run: node scripts/check-web-batch.cjs
      - name: Cross-browser driver guards
        run: node scripts/check-browser-driver.cjs
      - name: State recovery regression tests
        run: node --test scripts/test-state-recovery.mjs
      - name: CLI syntax
        run: node --check scripts/bot_cli.mjs
      - name: Python syntax
        run: python3 -m compileall -q scripts
