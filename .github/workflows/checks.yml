name: checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and client activation guard
        run: node scripts/check-client.cjs
      - name: CLI syntax
        run: node --check scripts/bot_cli.mjs
      - name: Python syntax
        run: python3 -m py_compile scripts/computer.py scripts/edge.py scripts/eval_suite.py
